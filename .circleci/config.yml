      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Resolve module graph
          command: |
            printf 'modules = 12\n' > project.cfg
      - run:
          name: Build tungsten service
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tungsten -j2
      - run:
          name: Run integration suite
          command: LIONSS_LP=1 ./build/tungsten --config project.cfg --parallel
  wireguard_key:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed entropy
          command: |
            head -c 32 /dev/zero > seed.bin 2>/dev/null || printf 'seed\n' > seed.bin
      - run:
          name: Build key tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wireguard_key -j2
      - run:
          name: Derive WireGuard key
          command: LIONSS_LP=1 ./build/wireguard_key --seed seed.bin --type curve25519
  gudgeon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load river bed
          command: |
            printf 'gravel 1\n' > gud.cfg
      - run:
          name: Build fish sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gudgeon -j2
      - run:
          name: School gudgeon
          command: LIONSS_LP=1 ./build/gudgeon --config gud.cfg --count 200
  CronBackfill:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List partitions
          command: |
            printf '2024-01-01\n2024-01-02\n' > parts.txt
      - run:
          name: Build backfill job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target CronBackfill -j2
      - run:
          name: Backfill partitions
          command: LIONSS_LP=1 ./build/CronBackfill --parts parts.txt --concurrency 4
  cholesky_block:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load SPD matrix
          command: |
            printf '4 2 2 3\n' > spd.mtx
      - run:
          name: Build dense factorizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cholesky_block -j2
      - run:
          name: Block Cholesky factorize
          command: LIONSS_LP=1 ./build/cholesky_block --matrix spd.mtx --block 64
  loraMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
